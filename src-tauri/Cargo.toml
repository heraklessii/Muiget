[package]
name = "muiget"
version = "0.1.4"
description = "Acik kaynak indirme yoneticisi - segmentli HTTP indirme + torrent"
authors = ["Muiget Contributors"]
license = "Apache-2.0"
repository = "https://github.com/heraklessii/Muiget"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "muiget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# `process`: ffmpeg cagrisi icin (media/mux.rs). Yalnizca istege bagli
# birlestirmede kullaniliyor; ffmpeg yoksa hic calistirilmiyor.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
futures-util = "0.3.34"
thiserror = "2.0.20"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

# DIKKAT: gzip/brotli/deflate ozellikleri BILEREK kapali. reqwest otomatik
# decompress ederse okunan byte sayisi ile Content-Length / Range araligi
# tutmaz ve segment muhasebesi bozulur. Istekler ayrica
# `Accept-Encoding: identity` gonderiyor (bkz. download/http.rs).
# `socks` proxy ayarinin socks5:// semasini kabul edebilmesi icin: HTTP/HTTPS
# proxy'si reqwest'te varsayilan olarak var, SOCKS5 bu ozellik olmadan
# "unsupported proxy scheme" hatasi veriyordu (karar #19).
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "charset", "socks"] }

# Indirilen dosyanin SHA-256 / MD5 ozeti (karar #21). Ikisi de saf Rust,
# ek sistem bagimliligi getirmiyor.
sha2 = "0.10"
md-5 = "0.10"

# HLS'in `METHOD=AES-128` parca sifrelemesini cozmek icin (karar #25).
# Anahtar manifestin gosterdigi adresten herkese acik veriliyor; burada
# atlatilan bir koruma yok. DRM (SAMPLE-AES / Widevine / PlayReady) ayristirma
# aninda reddediliyor - bkz. src/media/crypt.rs.
# Ayni RustCrypto ailesinden, saf Rust, sistem bagimliligi yok.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
base64 = "0.23.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-notification = "2.3.3"

# Pano izleme (karar #24). Yalnizca Rust tarafindan okunuyor; arayuze pano
# izni verilmedi, bu yuzden npm karsiligi da eklenmedi.
tauri-plugin-clipboard-manager = "2"

# Faz 4'te eklenecek: librqbit
# Bkz. docs/tasks.md

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tempfile = "3"
# Ucdan uca akis testi sifreli HLS parcalari **uretmek** zorunda: cozme
# tarafini gercekten sinamak icin fixture'in gercek AES-128-CBC olmasi gerek.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
