name: Release

# `v` ile başlayan bir etiket itilince kurulum paketlerini derleyip GitHub
# Release'ine yükler. Etiketi elle atmak bilinçli: her commit'te sürüm
# yayınlamak, henüz sahada denenmemiş bir uygulama için yanlış sinyal olurdu.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.ad }}
    runs-on: ${{ matrix.os }}

    # Üç platform da aynı etikete yükleniyor; `tauri-action` var olan yayını
    # bulup paketi ona ekliyor, ikinci bir Release açmıyor.
    #
    # Linux ve macOS paketleri **derleniyor ama sahada denenmedi** — proje
    # Windows'ta geliştiriliyor. Yine de üretiliyorlar: IDM'in Windows dışına
    # çıkamaması Muiget'in kalıcı farkı ve derlemeyi ertelemek, o platformlarda
    # ilk hatayı görmeyi de erteliyor. Yayın notu bu sınırı açıkça yazıyor.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ad: Windows kurulum paketleri
            args: ''
          # 22.04: Tauri v2'nin istediği webkit2gtk-4.1 bu sürümde var.
          - os: ubuntu-22.04
            ad: Linux paketleri (.deb / .AppImage)
            args: ''
          # Tek paketle hem Apple Silicon hem Intel.
          - os: macos-latest
            ad: macOS paketi (universal)
            args: '--target universal-apple-darwin'

    steps:
      - uses: actions/checkout@v4

      - name: Linux sistem bağımlılıkları
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal paket iki mimariyi de derliyor.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Önbellek anahtarı platforma göre ayrışsın.
          key: ${{ matrix.os }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Muiget ${{ github.ref_name }}
          args: ${{ matrix.args }}
          releaseBody: |
            Kurulum paketleri aşağıda.

            **Windows x64**
            - `.exe` — NSIS kurulumu (önerilen, daha küçük)
            - `.msi` — kurumsal dağıtım için

            **Linux x64**
            - `.AppImage` — kurulum gerektirmez
            - `.deb` — Debian/Ubuntu

            **macOS (universal — Apple Silicon + Intel)**
            - `.dmg`

            **Tarayıcı uzantısı** (Chrome, Edge, Firefox)
            - `muiget-uzanti-chrome-*.zip` — açıp `chrome://extensions` →
              Geliştirici modu → **Paketlenmemiş öğe yükle**
            - `muiget-uzanti-firefox-*.zip` — açıp `about:debugging` →
              **Geçici Eklenti Yükle** → `manifest.json`

            **Bu bir ön sürüm.** İndirme motoru, arayüz ve tarayıcı uzantısı
            çalışıyor ve otomatik testlerle doğrulanıyor; ancak uygulama geniş
            çapta sahada denenmedi ve torrent desteği henüz yok. Ne yaptığı ve
            **ne yapmadığı** için [README](https://github.com/heraklessii/Muiget#ne-yapmaz).

            **Linux ve macOS paketleri derleniyor ama geliştirici tarafından
            denenmedi** — proje Windows'ta geliştiriliyor. O platformlarda
            karşılaştığınız sorunları issue olarak bildirin.

            Kurulum paketleri imzasız: Windows SmartScreen ve macOS Gatekeeper
            uyarı gösterecek. Kod imzalama sertifikası henüz yok.

            Değişiklikler: [`docs/worklog.md`](https://github.com/heraklessii/Muiget/blob/main/docs/worklog.md)
          releaseDraft: false
          # Ön sürüm olarak işaretleniyor: uygulama gerçek dünyada henüz geniş
          # çapta denenmedi ve "Latest" rozetini taşımamalı.
          prerelease: true

  # Tarayıcı uzantısı, kurulum paketlerinden ayrı: Tauri onu derlemiyor.
  # Zip'lenip aynı yayına ekleniyor ki kullanıcı depoyu klonlamadan indirip
  # "Paketlenmemiş öğe yükle" ile kurabilsin.
  uzanti:
    name: Tarayıcı uzantısı paketleri
    needs: release
    # Etiketsiz (workflow_dispatch) çalıştırmada yüklenecek bir yayın yok.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Depodaki paketler CI'da zaten güncel tutuluyor (ci.yml → "uzanti"),
      # yine de yayına giren zip kaynaktan üretiliyor: yayın, depodaki bir
      # dosyanın unutulmuş olmasına bağlı kalmasın.
      - name: Paketleri üret
        run: npm run uzanti

      - name: Zip'le
        working-directory: dist-extension
        run: |
          zip -r ../muiget-uzanti-chrome-${{ github.ref_name }}.zip chrome
          zip -r ../muiget-uzanti-firefox-${{ github.ref_name }}.zip firefox

      - name: Yayına yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} muiget-uzanti-*.zip --clobber
