name: Pages

# Tanıtım sayfasını `gh-pages` dalına yayınlar.
#
# Neden `actions/deploy-pages` değil: o yol Pages'in depo ayarlarında önceden
# açılmış olmasını istiyor ve `configure-pages`in `enablement` seçeneği
# varsayılan `GITHUB_TOKEN` ile çalışmıyor (Pages sitesi oluşturmak depo
# yöneticisi yetkisi gerektiriyor). `gh-pages` dalına itmek yalnızca
# `contents: write` istiyor ve elle bir ayar değişikliği gerektirmiyor.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/ekran-goruntusu.png'
      - 'src-tauri/icons/**'
      - 'src/assets/fonts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ekran görüntüsü, ikon ve font depoda tek yerde duruyor (README ve
      # uygulama da onları kullanıyor). Siteye buradan kopyalanıyorlar ki
      # ikinci bir kopya tutup ayrışma riski doğmasın.
      - name: Siteyi hazırla
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/ekran-goruntusu.png _site/ekran-goruntusu.png
          cp src-tauri/icons/128x128@2x.png _site/ikon.png
          cp src/assets/fonts/outfit-latin.woff2 _site/outfit-latin.woff2
          cp src/assets/fonts/outfit-latin-ext.woff2 _site/outfit-latin-ext.woff2
          # Jekyll devre dışı: düz statik dosyalar yayınlanıyor.
          touch _site/.nojekyll

      - name: gh-pages dalına it
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pages yayını: ${{ github.sha }}"
          # Dal tamamen üretilmiş içerik; geçmişi tutmanın anlamı yok.
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
