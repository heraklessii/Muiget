name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dal için üst üste gelen çalıştırmaların eskisini iptal et: art arda
# atılan iki commit'te ilkini sonuna kadar beklemenin bir faydası yok.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Arayüz (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

  uzanti:
    name: Uzantı paketleri güncel mi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `dist-extension/` depoda duruyor: insanlar uzantıyı klonlayıp doğrudan
      # yükleyebilsin diye. Bedeli, kaynakla ayrışma riski — bu adım o riski
      # kapatıyor: paketler yeniden üretiliyor ve tek byte fark varsa derleme
      # düşüyor. Bağımlılık kurmaya gerek yok, betik saf Node.
      - name: Paketleri yeniden üret
        run: npm run uzanti

      - name: Fark var mı
        run: |
          if ! git diff --exit-code -- dist-extension; then
            echo "::error::dist-extension/ güncel değil. 'npm run uzanti' çalıştırıp sonucu commit'leyin."
            exit 1
          fi

  rust:
    name: Motor (test + clippy)
    # Windows: projenin birincil hedefi burası ve Tauri'nin Linux'ta istediği
    # webkit2gtk/gtk geliştirme paketlerini kurmak gerekmiyor.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Rust derlemesi `dist/` olmadan başarısız olur: `tauri.conf.json`
      # içindeki `frontendDist` yolunu `generate_context!` derleme anında
      # arıyor. Bu yüzden testten önce arayüz derleniyor.
      - run: npm ci
      - run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # Linux derlemesi yayın iş akışına eklendi; bunun ilk kez bir etiket
  # atıldığında denenmesi, yayını kırılgan hâle getirirdi. Burada yalnızca
  # `cargo check`: testler Windows işinde zaten koşuyor ve aynı motoru iki kez
  # sınamanın karşılığı, CI süresini ikiye katlamaya değmiyor.
  linux:
    name: Linux derlemesi (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
